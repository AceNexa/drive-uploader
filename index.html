
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Drive Uploader</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      color: #f37021;
    }
    input[type="file"] {
      margin: 20px 0;
    }
    button {
      background-color: #f37021;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #ff7f32;
    }
    .result {
      margin-top: 20px;
      word-break: break-word;
      max-width: 90%;
    }
  </style>
</head>
<body>
  <h1>Upload File to Drive</h1>
  <input type="file" id="fileInput" />
  <button onclick="uploadFile()">Upload</button>
  <div class="result" id="result"></div>

  <script>
    async function uploadFile() {
      const fileInput = document.getElementById("fileInput");
      const resultDiv = document.getElementById("result");
      if (!fileInput.files.length) {
        resultDiv.innerText = "Please select a file.";
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onloadend = async function () {
        const base64Data = reader.result.split(',')[1];

        const response = await fetch(
          "https://script.google.com/macros/s/AKfycbyOxeiekh-2dwD051IovKT2P5acbbHgmL4apOXyrE_XXCutNKxowzSN0dpDJdijuOneAw/exec",
          {
            method: "POST",
            body: JSON.stringify({
              file: base64Data,
              fileName: file.name,
              mimeType: file.type,
            }),
            headers: {
              "Content-Type": "application/json",
            },
          }
        );

        const result = await response.json();
        if (result.success) {
          resultDiv.innerHTML = \`✅ Uploaded: <a href="\${result.url}" target="_blank">\${result.url}</a>\`;
        } else {
          resultDiv.innerText = "❌ Upload failed: " + result.error;
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
